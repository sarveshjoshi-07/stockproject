<!DOCTYPE html>
<html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="projectcss.css">
   <title>Stock Price Tracker</title>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>📈Stock Price Tracker📈</h1>
      <div class="input-container">
        <input type="text" id="stock-input" placeholder="Enter Stock Symbol (e.g. TSLA)">
        <button id="search-btn">Search</button>
      </div>
    </header>

    <main class="main-content">
      <div class="stock-card">
        <h2 id="stock-name">Stock Name</h2>
        <p id="stock-price">Price: <span style="color:green">$0.00</span></p>
        <p id="stock-change">Change: <span style="color:green">0.00%</span></p>
      </div>
      <div class="chart-container">
        <canvas id="stock-chart"></canvas>
      </div>
    </main>
  </div>
  <script src="projectjavas.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
