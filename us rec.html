<!-- us.html (US Stock Tracker) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>US Stock Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      color: #000000;
      margin: 0;
    }
    header {
      background-color: #3366ff;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 0 0 10px 10px;
    }
    nav {
      background-color: #cce0ff;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    nav a {
      color: #003366;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    nav a:hover {
      background-color: rgba(51, 102, 255, 0.2);
    }

    .container {
      max-width: 960px;
      margin: auto;
      padding: 20px;
      background-color: #f0f0f0;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      padding: 10px;
      width: 200px;
      margin-right: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 15px;
      background-color: #00cc00;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .green { color: green; }
    .red { color: red; }
    canvas {
      max-width: 100%;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 US Stock Tracker</h1>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="us.html">US Stocks</a>
    <a href="india.html">Indian Stocks</a>
    <a href="aboutus.html"> About Us </a>
  </nav>
  <div class="container">
    <input type="text" id="usSymbol" placeholder="Enter US Stock Symbol (e.g. AAPL)">
    <button onclick="fetchStock('us')">Search</button>
    <h3 id="usName"></h3>
    <p>Price: $<span id="usPrice"></span></p>
    <p>Change: <span id="usChange"></span></p>
    <canvas id="usChart"></canvas>
  </div>
  <script>
    const apiKey = 'f3aad761698b41748fdf2e1f7b7012e2';

    async function fetchStock(region) {
      const symbol = document.getElementById(`${region}Symbol`).value.toUpperCase();
      const nameEl = document.getElementById(`${region}Name`);
      const priceEl = document.getElementById(`${region}Price`);
      const changeEl = document.getElementById(`${region}Change`);
      const chartId = `${region}Chart`;

      try {
        const response = await fetch(`https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1day&outputsize=15&apikey=${apiKey}`);
        const data = await response.json();

        if (data.status === "error") {
          alert(data.message || "Invalid symbol or API limit reached");
          return;
        }

        const values = data.values.reverse(); // Chronological order
        const dates = values.map(item => item.datetime);
        const prices = values.map(item => parseFloat(item.close));

        const latest = prices[prices.length - 1];
        const previous = prices[prices.length - 2];
        const change = (((latest - previous) / previous) * 100).toFixed(2);

        nameEl.textContent = symbol;
        priceEl.textContent = latest.toFixed(2);
        changeEl.innerHTML = `${Math.abs(change)}% ${(change >= 0 ? '🔼' : '🔽')}`;
        changeEl.className = change >= 0 ? 'green' : 'red';

        new Chart(document.getElementById(chartId), {
          type: 'line',
          data: {
            labels: dates,
            datasets: [{
              label: 'Stock Price (USD)',
              data: prices,
              borderColor: '#00cc00',
              backgroundColor: '#ccffcc',
              tension: 0.2,
              fill: false
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: true }
            }
          }
        });
      } catch (error) {
        alert("Failed to fetch data.");
        console.error(error);
      }
    }
  </script>
</body>
</html>
